services:
  # Monolithic All-In-One Web Service (Frontend + Backend REST API)
  - type: web
    name: dayflow-hrms
    env: node
    plan: free
    buildCommand: "npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: dayflow-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_SALT_ROUNDS
        value: 12

databases:
  # Self-Hosted Free PostgreSQL Relational Database
  - name: dayflow-postgres
    plan: free
    databaseName: dayflow_hrms
    user: dayflow_admin
